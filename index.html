<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sid's Gym</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0f11; --surf: #17191d; --surf2: #1e2126; --surf3: #252a31;
  --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.13);
  --text: #f0f2f5; --text2: #8a9099; --text3: #545c66;
  --accent: #c8f04a; --accent-dim: rgba(200,240,74,0.13);
  --blue: #4a9cf0; --blue-dim: rgba(74,156,240,0.13);
  --orange: #f0a84a; --orange-dim: rgba(240,168,74,0.13);
  --red: #f04a4a; --red-dim: rgba(240,74,74,0.12);
  --green: #4af0a0; --green-dim: rgba(74,240,160,0.12);
  --r: 12px; --rsm: 8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;overflow:hidden;}
body{display:flex;flex-direction:column;}
.nav{background:rgba(14,15,17,0.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:12px 16px 8px;flex-shrink:0;padding-top:max(12px,env(safe-area-inset-top));}
.nav-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.nav-brand{font-size:18px;font-weight:800;color:var(--accent);letter-spacing:-0.3px;}
.nav-timer{font-family:'DM Mono',monospace;font-size:20px;font-weight:500;color:var(--accent);display:none;}
.nav-timer.active{display:block;}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);background:var(--surf);border-bottom:1px solid var(--border);flex-shrink:0;}
.tab{padding:11px 4px;text-align:center;font-size:11px;font-weight:700;color:var(--text3);cursor:pointer;letter-spacing:0.05em;border-bottom:2px solid transparent;transition:all 0.18s;user-select:none;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.page{display:none;padding:14px 14px 100px;}
.page.active{display:block;}
.type-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px;}
.type-btn{background:var(--surf);border:1px solid var(--border);border-radius:var(--rsm);padding:10px 4px;text-align:center;font-size:11px;font-weight:700;color:var(--text2);cursor:pointer;transition:all 0.15s;letter-spacing:0.02em;}
.type-btn.active-upper{background:var(--blue-dim);border-color:var(--blue);color:var(--blue);}
.type-btn.active-lower{background:var(--orange-dim);border-color:var(--orange);color:var(--orange);}
.type-btn.active-full{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}
.type-btn.active-cardio{background:rgba(74,240,160,0.13);border-color:var(--green);color:var(--green);}
.cardio-form{display:flex;flex-direction:column;gap:10px;}
.cardio-row{background:var(--surf);border:1px solid var(--border);border-radius:var(--rsm);padding:14px;}
.cardio-row-label{font-size:10px;font-family:'DM Mono',monospace;color:var(--text3);letter-spacing:0.07em;margin-bottom:8px;}
.cardio-subtype-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.cardio-sub-btn{padding:10px 4px;border-radius:6px;border:1px solid var(--border2);background:var(--surf2);color:var(--text2);font-family:'Syne',sans-serif;font-size:11px;font-weight:700;cursor:pointer;text-align:center;}
.cardio-sub-btn.active{background:rgba(74,240,160,0.13);border-color:var(--green);color:var(--green);}
.cardio-field{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.cardio-field-label{font-size:13px;font-weight:600;color:var(--text);}
.cardio-field-unit{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;}
.cardio-input{background:var(--surf2);border:1px solid var(--border2);border-radius:6px;padding:10px 12px;font-size:18px;font-weight:700;color:var(--text);font-family:'DM Mono',monospace;width:110px;text-align:right;}
.cardio-input:focus{outline:none;border-color:var(--green);}
.cardio-pace{font-size:22px;font-weight:800;color:var(--green);font-family:'DM Mono',monospace;text-align:center;padding:4px 0;}
.cardio-pace-label{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;text-align:center;letter-spacing:0.06em;margin-top:2px;}
.cardio-notes{background:var(--surf2);border:1px solid var(--border2);border-radius:6px;padding:10px 12px;font-size:14px;color:var(--text);font-family:'Syne',sans-serif;width:100%;resize:none;min-height:70px;}
.cardio-notes:focus{outline:none;border-color:var(--green);}
.cardio-effort-row{display:flex;gap:6px;flex-wrap:wrap;}
.effort-btn{padding:7px 12px;border-radius:20px;border:1px solid var(--border2);background:var(--surf2);color:var(--text2);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;}
.effort-btn.active{background:rgba(74,240,160,0.13);border-color:var(--green);color:var(--green);}
.phase-bar{display:flex;align-items:center;justify-content:space-between;background:var(--surf);border:1px solid var(--border);border-radius:var(--rsm);padding:10px 14px;margin-bottom:10px;}
.phase-label{font-size:12px;font-weight:700;color:var(--text2);letter-spacing:0.05em;}
.phase-timer{font-family:'DM Mono',monospace;font-size:18px;font-weight:500;color:var(--text3);}
.phase-timer.running{color:var(--green);}
.phase-timer.done{color:var(--accent);}
.phase-btns{display:flex;gap:6px;}
.phase-btn{background:var(--surf2);border:1px solid var(--border2);border-radius:6px;padding:7px 14px;font-size:12px;font-weight:700;color:var(--text);cursor:pointer;font-family:'Syne',sans-serif;}
.phase-btn.go{background:var(--green-dim);border-color:var(--green);color:var(--green);}
.phase-btn.stop{background:var(--red-dim);border-color:var(--red);color:var(--red);}
.start-btn{width:100%;padding:15px;border-radius:var(--r);border:none;background:var(--accent);color:#0a0b0c;font-family:'Syne',sans-serif;font-size:16px;font-weight:800;cursor:pointer;margin-bottom:14px;letter-spacing:0.02em;}
.start-btn:active{opacity:0.85;transform:scale(0.98);}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.stat-card{background:var(--surf);border-radius:var(--rsm);padding:12px 10px;}
.stat-label{font-size:9px;font-family:'DM Mono',monospace;color:var(--text3);letter-spacing:0.07em;margin-bottom:5px;}
.stat-val{font-size:22px;font-weight:800;color:var(--text);}
.stat-val.accent{color:var(--accent);}
.stat-sub{font-size:9px;color:var(--text3);margin-top:2px;}
.ex-list{display:flex;flex-direction:column;gap:8px;}
.ex-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:opacity 0.2s;}
.ex-card.dragging{opacity:0.5;}
.ex-header{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;}
.move-btn{background:var(--surf3);border:none;border-radius:4px;color:var(--text3);font-size:13px;width:24px;height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;}
.move-btn:active{background:var(--border2);color:var(--text);}
.move-btn:disabled{opacity:0.2;pointer-events:none;}
.ex-info{flex:1;min-width:0;}
.ex-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ex-meta{font-size:11px;color:var(--text2);font-family:'DM Mono',monospace;margin-top:2px;}
.ex-chevron{color:var(--text3);font-size:16px;transition:transform 0.2s;flex-shrink:0;}
.ex-chevron.open{transform:rotate(90deg);}
.ex-body{display:none;padding:0 14px 12px;}
.ex-body.open{display:block;}
.sets-header{display:grid;grid-template-columns:24px 1fr 1fr 32px;gap:8px;padding:4px 0 6px;border-bottom:1px solid var(--border);}
.sets-col-label{font-size:9px;font-family:'DM Mono',monospace;color:var(--text3);letter-spacing:0.06em;text-align:center;}
.set-row{display:grid;grid-template-columns:24px 1fr 1fr 32px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);}
.set-row:last-of-type{border-bottom:none;}
.set-num{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;text-align:center;}
.set-val{background:var(--surf2);border:1px solid var(--border2);border-radius:6px;padding:9px 6px;font-size:15px;font-weight:600;color:var(--text);font-family:'DM Mono',monospace;text-align:center;cursor:pointer;user-select:none;transition:all 0.12s;}
.set-val:active{background:var(--surf3);}
.set-val.done-val{border-color:var(--accent);color:var(--accent);}
.set-check{width:32px;height:32px;border-radius:50%;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s;flex-shrink:0;}
.set-check.done{background:var(--accent);border-color:var(--accent);}
.set-check.done::after{content:'✓';font-size:14px;color:#000;font-weight:800;}
.add-set-btn{width:100%;margin-top:10px;padding:9px;border-radius:6px;border:1px dashed var(--border2);background:transparent;color:var(--text3);font-family:'DM Mono',monospace;font-size:12px;cursor:pointer;}
.del-set-btn{background:none;border:none;color:var(--text3);font-size:14px;cursor:pointer;padding:4px 6px;line-height:1;border-radius:4px;transition:color 0.15s;}
.add-ex-btn{width:100%;margin-top:10px;padding:13px;border-radius:var(--r);border:1px dashed var(--border2);background:transparent;color:var(--text2);font-family:'Syne',sans-serif;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:0.03em;}
.finish-btn{width:100%;padding:16px;border-radius:var(--r);border:none;background:var(--accent);color:#000;font-family:'Syne',sans-serif;font-size:16px;font-weight:800;cursor:pointer;margin-top:14px;letter-spacing:0.02em;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity 0.2s;}
.overlay.show{opacity:1;pointer-events:all;}
</style>
</head>
<body>
<script>
function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d;}catch{return d;}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v));}
const SESSIONS_KEY='sidsgym_sessions';
const HEALTH_KEY='sidsgym_health';
const LIBRARY_KEY='sidsgym_library';
const METRICS_KEY='sidsgym_custom_metrics';
const BODY_KEY='sidsgym_body';
const APP_VERSION='v3.3';
let sessions=load(SESSIONS_KEY,{}), healthLog=load(HEALTH_KEY,{}), library=load(LIBRARY_KEY,{upper:[],lower:[],full:[]}), customMetrics=load(METRICS_KEY,{vars:[],logs:[]}), bodyData=load(BODY_KEY,{height:null,measurements:{}});
let cloudLoaded=false;
function getSheetsUrl(){ return localStorage.getItem('sidsgym_sheets_url')||''; }
function collectState(){ return { sessions, health: healthLog, library, customMetrics, bodyData }; }
function syncToSheets(){
  const url=getSheetsUrl();
  if(!url) return Promise.resolve(false);
  return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'saveAll',state:collectState()})})
    .then(r=>r.json())
    .then(()=>true)
    .catch(()=>false);
}
function saveSession(){ save(SESSIONS_KEY,sessions); if(cloudLoaded) syncToSheets(); }
function deleteWorkout(sessionId){
  if(!sessionId || !sessions[sessionId]) return;
  delete sessions[sessionId];
  save(SESSIONS_KEY, sessions);
  updateStats?.();
  renderHistory?.();
  renderTrends?.();
  if(cloudLoaded) syncToSheets();
}
</script>
</body>
</html>
